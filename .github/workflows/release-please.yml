name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this manual publish is needed (e.g. "retry after fixing npm auth")'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
    steps:
      # Enterprise policy blocks the default GITHUB_TOKEN from opening PRs, so
      # mint a token from the release-bot GitHub App (Contents + PRs: write).
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # When a Release PR is merged, release-please cuts the GitHub releases and this
  # job publishes the released packages to npm (provenance-signed, public).
  #
  # This ran on npm Trusted Publishing (OIDC) briefly (PRs #18-#24). Every
  # precondition pnpm's own OIDC exchange checks for was confirmed correct -
  # GITHUB_ACTIONS, both ACTIONS_ID_TOKEN_REQUEST_* vars, even a manually
  # fetched token forwarded via NPM_ID_TOKEN (GitHub's own minting endpoint
  # returned a real 200) - and it still failed with ENEEDAUTH every time,
  # with zero OIDC-related log output to diagnose further. Root cause was
  # never pinned down after tracing pnpm's actual source through the whole
  # `-r publish` call chain. Reverted to the plain NODE_AUTH_TOKEN secret
  # this job used for 15+ prior successful releases, to stop a real release
  # sitting blocked on an unresolved pnpm-internal mystery. OIDC is a
  # reasonable thing to revisit later with more room to investigate; the PR
  # history above has the full trail if anyone picks it back up.
  publish:
    needs: release-please
    # workflow_dispatch is a manual retry escape hatch (e.g. the publish step
    # failed on a dead auth secret and the release is already tagged, so
    # there is nothing new for release-please to create - releases_created
    # would report false on a fresh run). npm rejects re-publishing a
    # version that already succeeded, so a redundant dispatch is harmless.
    if: github.event_name == 'workflow_dispatch' || needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r run build

      - name: Publish (connector-core before connector-server; topo-ordered)
        run: pnpm -r publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
